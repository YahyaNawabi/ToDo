<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        div {
            margin-bottom: 20px;
            text-align: center;
        }

        input, button {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin: 5px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        input:focus, button:focus {
            outline: none;
            border-color: #007BFF;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        button {
            background-color: #007BFF;
            color: #fff;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            text-align: center;
            padding: 8px;
        }

        th {
            background-color: #f4f4f4;
        }

        img {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <label for="task">Task:</label>
        <input type="text" id="task" placeholder="Enter your task">
        
        <label for="time">Time:</label>
        <input type="time" id="time"> <!-- NEW: Time input -->
    
        <button id="add">Add Task</button>
    </div>
    
    <table id="taskTable">
        <thead>
            <tr>
                <th>NO</th>
                <th>Task</th>
                <th>Time</th> <!-- NEW: Time column -->
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dynamic rows will be added here -->
        </tbody>
    </table>

    <script src="./todolist in the table.js"></script>
</body>
</html>
